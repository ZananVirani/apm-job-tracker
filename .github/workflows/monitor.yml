name: APM Notifier

on:
  schedule:
    # Hourly backup; Cloudflare dispatches the primary check every five minutes.
    - cron: "27 * * * *"
  workflow_dispatch:
    inputs:
      send_test_notification:
        description: Send a Telegram test message during this run
        required: false
        type: boolean
        default: false
      show_tiktok_history:
        description: Report restored TikTok discovery and notification timestamps
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ inputs.show_tiktok_history && 'apm-notifier-history' || 'apm-notifier' }}
  cancel-in-progress: false

jobs:
  check-career-pages:
    runs-on: ubuntu-latest
    # Full descriptions are fetched for new candidates, politely paced per host.
    timeout-minutes: 20
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      STATE_PATH: ${{ github.workspace }}/data/notifier.sqlite3
      SOURCES_PATH: ${{ github.workspace }}/config/sources.json
      CHECK_INTERVAL_SECONDS: "300"
      REQUEST_TIMEOUT_SECONDS: "25"
      REQUEST_CONCURRENCY: "8"
      TARGET_YEAR: "2027"
      GRADUATION_YEAR: "2028"
      GRADUATION_MONTH: "4"
      # Must-include companies run every dispatch; the rest at most hourly.
      ADDITIONAL_SCAN_MINUTES: "60"
      MAX_DESCRIPTION_FETCHES: "250"
      HOST_INTERVAL_SECONDS: "1.0"
      EXPORT_DIR: ${{ github.workspace }}/data
      # If history is lost, send current matches rather than silently missing them.
      ALERT_ON_FIRST_RUN: "true"

    steps:
      - name: Check out notifier
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Restore notification history
        id: restore-state
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: data
          key: apm-notifier-state-${{ github.run_id }}
          restore-keys: |
            apm-notifier-state-

      - name: Validate cloud configuration
        if: ${{ !inputs.show_tiktok_history }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${TELEGRAM_BOT_TOKEN}" || -z "${TELEGRAM_CHAT_ID}" ]]; then
            echo "Required Telegram secrets are not configured."
            exit 1
          fi
          mkdir -p data
          python3 --version
          google-chrome --version

      - name: Verify monitoring rules
        run: python3 -m unittest discover -s tests -q

      - name: Report restored TikTok notification history
        if: ${{ inputs.show_tiktok_history }}
        run: python3 -m apm_notifier history --company TikTok

      - name: Check career pages and deliver new alerts
        if: ${{ !inputs.show_tiktok_history }}
        run: python3 -m apm_notifier run --once

      - name: Upload current matches (job_matches.csv / .json)
        if: ${{ always() && !inputs.show_tiktok_history }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: job-matches
          path: |
            data/job_matches.csv
            data/job_matches.json
          if-no-files-found: ignore
          retention-days: 3

      - name: Send requested cloud test notification
        if: ${{ inputs.send_test_notification && !inputs.show_tiktok_history }}
        run: python3 -m apm_notifier test-notification

      - name: Save notification history
        if: ${{ always() && !inputs.show_tiktok_history }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: data
          key: apm-notifier-state-${{ github.run_id }}
