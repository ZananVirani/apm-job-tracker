name = "apm-notifier-dispatcher"
main = "worker.js"
compatibility_date = "2024-09-23"

[triggers]
crons = ["*/5 * * * *"]

[vars]
GITHUB_OWNER = "ZananVirani"
GITHUB_REPO = "apm-job-tracker"
WORKFLOW_FILE = "monitor.yml"
GITHUB_REF = "main"
# GITHUB_TOKEN is a secret: set it with `npx wrangler secret put GITHUB_TOKEN`.
